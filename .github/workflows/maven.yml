name: Maven Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and test

    runs-on: ubuntu-latest

    steps:
      # Récupère le contenu du repository dans la machine GitHub Actions.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installe le JDK utilisé pour compiler notre projet.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Compile tous les modules et exécute les tests.
      - name: Build with Maven
        run: mvn --batch-mode clean verify